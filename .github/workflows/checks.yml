# Runs on every push and pull request. It needs no secrets, so it also runs for pull requests from forks.
name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # ponytail: the older pages still have lint errors, so this step reports them without failing the run. Remove
      # continue-on-error once `npm run lint` passes.
      - run: npm run lint
        continue-on-error: true
      - run: npm run build
      # Fails only on high or critical advisories in packages that ship to production.
      - run: npm audit --omit=dev --audit-level=high
